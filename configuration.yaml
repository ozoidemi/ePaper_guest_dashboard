# Use this file if you have Unifi

automation: !include automations.yaml

input_select:
  # Language selector
  guest_display_language:
    name: "Display Language"
    options:
      - English
      - Castellano
      - Français 
      - Italiano
      - Deutsch
    initial: English
    icon: mdi:translate

input_boolean:
  # Helpers - configuration and functional variables
  guest_display_border_flag:
    name: "guest_display_border_flag"
    icon: "mdi:border-outside"
    
  guest_display_grid_activated:
    name: "guest_display_grid_activated"
    icon: mdi:border-inside
    
  guest_display_prevent_deep_sleep:
    name: "guest_display_prevent_deep_sleep"
    icon: "mdi:sleep-off"

binary_sensor:
 # Activate and desactivate Deep Sleep daily
 - platform: tod
   name: Guest Display Deep Sleep Flag
   after: "21:58"
   before: "07:58"
   unique_id: guest_display_deep_sleep_flag

rest:
  # Met.no locationforecast — single source for all weather data on the display.
  # Replaces HA weather integration dependency for current conditions and forecast.
  # Coordinates are pulled automatically from zone.home.
  # Met.no terms require a descriptive User-Agent with a contact/project URL.
  - resource_template: >-
      https://api.met.no/weatherapi/locationforecast/2.0/complete?lat={{ state_attr('zone.home', 'latitude') }}&lon={{ state_attr('zone.home', 'longitude') }}
    headers:
      User-Agent: "ePaper-Guest-Dashboard https://github.com/ozoidemi/ePaper_guest_dashboard"
    scan_interval: 1800
    sensor:
      - name: "UV Index"
        unique_id: met_no_uv_index
        value_template: >-
          {{ value_json.properties.timeseries[0].data.instant.details.ultraviolet_index_clear_sky | default(0) }}
        state_class: measurement

      - name: "current_temperature"
        unique_id: met_no_current_temperature
        value_template: >-
          {{ value_json.properties.timeseries[0].data.instant.details.air_temperature | default(0) }}
        state_class: measurement
        unit_of_measurement: "°C"

      - name: "current_humidity"
        unique_id: met_no_current_humidity
        value_template: >-
          {{ value_json.properties.timeseries[0].data.instant.details.relative_humidity | default(0) }}
        state_class: measurement
        unit_of_measurement: "%"

      - name: "forecast_temperature_1h"
        unique_id: met_no_forecast_temperature_1h
        value_template: >-
          {{ value_json.properties.timeseries[1].data.instant.details.air_temperature | default(0) }}
        state_class: measurement
        unit_of_measurement: "°C"

      - name: "forecast_temperature_2h"
        unique_id: met_no_forecast_temperature_2h
        value_template: >-
          {{ value_json.properties.timeseries[2].data.instant.details.air_temperature | default(0) }}
        state_class: measurement
        unit_of_measurement: "°C"

      - name: "forecast_temperature_3h"
        unique_id: met_no_forecast_temperature_3h
        value_template: >-
          {{ value_json.properties.timeseries[3].data.instant.details.air_temperature | default(0) }}
        state_class: measurement
        unit_of_measurement: "°C"

      - name: "forecast_condition_1h"
        unique_id: met_no_forecast_condition_1h
        value_template: >-
          {{ value_json.properties.timeseries[1].data.next_1_hours.summary.symbol_code | default('') }}

      - name: "forecast_condition_2h"
        unique_id: met_no_forecast_condition_2h
        value_template: >-
          {{ value_json.properties.timeseries[2].data.next_1_hours.summary.symbol_code | default('') }}

      - name: "forecast_condition_3h"
        unique_id: met_no_forecast_condition_3h
        value_template: >-
          {{ value_json.properties.timeseries[3].data.next_1_hours.summary.symbol_code | default('') }}

      - name: "forecast_datetime_1h"
        unique_id: met_no_forecast_datetime_1h
        value_template: >-
          {% set dt = as_datetime(value_json.properties.timeseries[1].time) | as_local %}
          {{ dt.strftime('%-I%p') }}

      - name: "forecast_datetime_2h"
        unique_id: met_no_forecast_datetime_2h
        value_template: >-
          {% set dt = as_datetime(value_json.properties.timeseries[2].time) | as_local %}
          {{ dt.strftime('%-I%p') }}

      - name: "forecast_datetime_3h"
        unique_id: met_no_forecast_datetime_3h
        value_template: >-
          {% set dt = as_datetime(value_json.properties.timeseries[3].time) | as_local %}
          {{ dt.strftime('%-I%p') }}

template: !include template.yaml

