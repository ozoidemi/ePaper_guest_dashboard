            canvas.forecast_info.temp_h[2] = id(temp_3h).state;

binary_sensor:
  # Identifies whether Deep Sleep is On/Off
  - platform: homeassistant
    id: deep_sleep_activated
    entity_id: binary_sensor.guest_display_deep_sleep_flag
    internal: True
    name: "Deep Sleep Status"
    on_state:
      then:
        - lambda: |-
            if(id(deep_sleep_activated).state) {
              ESP_LOGI("Binary Sensor", "Deep Sleep flag is ON.");
              id(epaper75_01).update();
              id(last_display_refresh) = millis();
            } else {
              ESP_LOGI("Binary Sensor", "Deep Sleep flag is OFF.");
            }

  # Disables Deep Sleep functionality
  - platform: homeassistant
    id: prevent_deep_sleep
    entity_id: input_boolean.guest_display_prevent_deep_sleep
    internal: True
    on_state:
      then:
        - lambda: |-
            if(id(prevent_deep_sleep).state && id(deep_sleep_activated).state) {
              ESP_LOGI("Prevent Deep Sleep", "Prevent Deep Sleep is ON");
              id(epaper75_01).update();
              id(last_display_refresh) = millis();
            } else if (id(prevent_deep_sleep).state) {
              ESP_LOGI("Prevent Deep Sleep", "Prevent Deep Sleep is ON");
            } else {
              ESP_LOGI("Prevent Deep Sleep", "Prevent Deep Sleep is OFF");
            }
            
  # Activates/Disables Screen Padding (Outside Border)
  - platform: homeassistant
    id: canvas_padding_activated
    entity_id: input_boolean.guest_display_border_flag
    internal: True
    on_state:
      then:
        - lambda: |-
            if(id(canvas_padding_activated).state) {
              ESP_LOGI("Canvas Paddding", "Canvas Padding is On");
            } else {
              ESP_LOGI("Canvas Paddding", "Canvas Padding is Off");
            }
            // Skip refresh during boot — settle_display handles it
            if (id(boot_settled)) {
              id(epaper75_01).update();
              id(last_display_refresh) = millis();
            }

  # Activates/Disables Screen Grid
  - platform: homeassistant
    id: grid_activated
    entity_id: input_boolean.guest_display_grid_activated
    internal: True
    on_state:
      then:
        - lambda: |-
            if(id(grid_activated).state) {
              ESP_LOGI("Screen Grid", "Screen Grid is On");
            } else {
              ESP_LOGI("Screen Grid", "Screen Grid is Off");
            }
            // Skip refresh during boot — settle_display handles it
            if (id(boot_settled)) {
              id(epaper75_01).update();
              id(last_display_refresh) = millis();
            }

  # Template Variables
  # Display Initialization
  #- platform: template
  #  id: display_initialized
  #  internal: True

script:
  # Refresh #2 — clears the loading screen and shows the full dashboard.
  # Waits 5 s after fetch_network_state completes so all HA sensor data has settled.
  # If this refresh lands in minute X4/X9 (within 60 s of the next 5-min timer tick),
  # that tick is suppressed to avoid an immediate back-to-back refresh.
  - id: show_full_dashboard
    mode: single
    then:
      - delay: 10s
      - lambda: |-
          id(show_loading_screen) = false;
          auto t = id(esptime).now();
          if (t.is_valid() && t.minute % 5 == 4) {
            id(skip_next_timer) = true;
            ESP_LOGI("boot", "Refresh #2 at minute %d -- skipping next 5-min timer", t.minute);
          }
          id(epaper75_01).update();
          id(last_display_refresh) = millis();
          id(boot_settled) = true;

  # Deep Sleep Implementation
  - id: consider_deep_sleep
    mode: queued
    then:
      - delay: 10s
      - if:
          condition:
            binary_sensor.is_on: prevent_deep_sleep
          then:
            - logger.log: 'Skipping sleep, per prevent_deep_sleep'
          else:
            - deep_sleep.enter: deep_sleep_control
      - script.execute: consider_deep_sleep

  # Fetches guest network state from UniFi on boot
  # Populates guest_password and guest_network_enabled globals
  # Mode single: if called while already running, second call is ignored
  - id: fetch_network_state
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("UniFi", "fetch_network_state started");
      - http_request.get:
          url: "https://${unifi_controller_url}/proxy/network/api/s/default/list/wlanconf"
          request_headers:
            X-API-KEY: "${unifi_api_key}"
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGE("UniFi", "GET list/wlanconf failed, status: %d", response->status_code);
                    if (!id(boot_settled)) {
                      id(show_full_dashboard).execute();
                    }
                    return;
                  }
                  // Read body from stream into string
                  std::string body;
                  body.reserve(4096);
                  uint8_t buf[512];
                  int len;
                  while ((len = response->read(buf, sizeof(buf))) > 0) {
                    body.append((char *) buf, len);
                  }
                  // Parse with ArduinoJSON v7
                  JsonDocument doc;
                  DeserializationError err = deserializeJson(doc, body);
                  if (err) {
                    ESP_LOGE("UniFi", "JSON parse failed: %s", err.c_str());
                    return;
                  }
                  bool found = false;
                  for (JsonObject wlan : doc["data"].as<JsonArray>()) {
                    if (strcmp(wlan["_id"] | "", "${unifi_wlan_id}") == 0) {
                      id(guest_password) = std::string(wlan["x_passphrase"] | "");
                      id(guest_network_enabled) = wlan["enabled"] | false;
                      found = true;
                      ESP_LOGI("UniFi", "Matched WLAN: %s", (wlan["name"] | "?"));
                      ESP_LOGI("UniFi", "Network state fetched — enabled: %s",
                               id(guest_network_enabled) ? "true" : "false");
                      ESP_LOGI("UniFi", "Password length: %d chars", id(guest_password).length());
                      if (!id(boot_settled)) {
                        id(show_full_dashboard).execute();
                      } else {
                        id(epaper75_01).update();
                        id(last_display_refresh) = millis();
                      }
                      break;
                    }
                  }
                  if (!found) {
                    ESP_LOGE("UniFi", "WLAN ID not found in response — check unifi_wlan_id secret");
                  }

  # Generates a new 12-char guest password and pushes it to UniFi
  # Password is staged in guest_password global before the PUT.
  # On HTTP 200: stays committed. On failure: re-fetches from UniFi to restore consistent state.
  - id: rotate_guest_password
    mode: single
    then:
      - lambda: |-
          esp_random(); // discard first call, let entropy pool settle
          const char pool[] = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%";
          const size_t pool_len = sizeof(pool) - 1;
          std::string new_pass;
          new_pass.reserve(12);
          for (int i = 0; i < 12; i++) {
            new_pass += pool[esp_random() % pool_len];
          }
          id(guest_password) = new_pass;
          ESP_LOGI("UniFi", "Password candidate generated, attempting PUT...");
      - http_request.send:
          method: PUT
          url: "https://${unifi_controller_url}/proxy/network/api/s/default/rest/wlanconf/${unifi_wlan_id}"
          request_headers:
            X-API-KEY: "${unifi_api_key}"
            Content-Type: "application/json"
          body: !lambda |-
            return "{\"x_passphrase\":\"" + id(guest_password) + "\"}";
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    ESP_LOGI("UniFi", "Password rotation confirmed");
                    uint32_t now = millis();
                    if (now - id(last_display_refresh) >= 60000) {
                      id(epaper75_01).update();
                      id(last_display_refresh) = now;
                    } else {
                      ESP_LOGI("UniFi", "Display update deferred — last refresh %u ms ago",
                               now - id(last_display_refresh));
                    }
                  } else {
                    ESP_LOGE("UniFi", "PUT failed (status %d) — re-fetching to restore state",
                             response->status_code);
                    id(fetch_network_state).execute();
                  }

switch:
  - platform: template
    id: guest_network
    name: "Guest Network"
    icon: "mdi:wifi"
    lambda: |-
      return id(guest_network_enabled);
    turn_on_action:
      - http_request.send:
          method: PUT
          url: "https://${unifi_controller_url}/proxy/network/api/s/default/rest/wlanconf/${unifi_wlan_id}"
          request_headers:
            X-API-KEY: "${unifi_api_key}"
            Content-Type: "application/json"
          body: '{"enabled": true}'
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    id(guest_network_enabled) = true;
                    id(epaper75_01).update();
                    id(last_display_refresh) = millis();
                    ESP_LOGI("UniFi", "Guest network enabled");
                  } else {
                    ESP_LOGE("UniFi", "Enable failed, status: %d", response->status_code);
                  }
    turn_off_action:
      - http_request.send:
          method: PUT
          url: "https://${unifi_controller_url}/proxy/network/api/s/default/rest/wlanconf/${unifi_wlan_id}"
          request_headers:
            X-API-KEY: "${unifi_api_key}"
            Content-Type: "application/json"
          body: '{"enabled": false}'
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    id(guest_network_enabled) = false;
                    id(epaper75_01).update();
                    id(last_display_refresh) = millis();
                    ESP_LOGI("UniFi", "Guest network disabled");
                  } else {
                    ESP_LOGE("UniFi", "Disable failed, status: %d", response->status_code);
                  }

