    internal: True
    name: "Current Humidity"

  # Get current UV index — via met.no locationforecast REST sensor in HA
  - platform: homeassistant
    id: ha_uv_index
    entity_id: sensor.uv_index
    internal: True
    name: "Current UV Index Value"

  # Forecasts
  # Temperature sensors
  # Temperature next hour
  - platform: homeassistant
    id: temp_1h
    entity_id: sensor.forecast_temperature_1h
    internal: True
    name: "Temperature Forecast +1h"
    on_value: 
      then:
        - lambda: |-
            // Store sensor state in array for easy display printing
